<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB Lending - Admin Portal Authentication</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body { 
            background: #0f172a; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem; 
        }
        
        .login-card { 
            background: white; 
            width: 100%; 
            max-width: 420px; 
            border-radius: 16px; 
            padding: 2.5rem; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.3); 
        }

        .brand-header { 
            text-align: center; 
            margin-bottom: 2rem; 
        }

        .brand-header i { 
            font-size: 3rem; 
            color: #1b4332; 
            margin-bottom: 0.5rem; 
        }

        .brand-header h2 { 
            color: #1b4332; 
            font-weight: 800; 
            font-size: 1.5rem;
        }

        .brand-header p {
            font-size: 0.85rem; 
            color: #64748b;
            margin-top: 0.2rem;
        }
        
        .form-group { 
            margin-bottom: 1.2rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.4rem; 
        }

        .form-group label { 
            font-size: 0.85rem; 
            font-weight: 700; 
            color: #475569; 
        }

        .form-group input { 
            padding: 0.8rem; 
            border: 1.5px solid #cbd5e1; 
            border-radius: 8px; 
            outline: none; 
            font-size: 0.95rem; 
            transition: border-color 0.2s;
        }

        .form-group input:focus { 
            border-color: #1b4332; 
        }

        .submit-btn { 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 0.85rem; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 1rem; 
            cursor: pointer; 
            transition: background 0.2s; 
            margin-top: 0.5rem; 
        }

        .btn-login { 
            background: #1b4332; 
        }

        .btn-login:hover { 
            background: #2d6a4f; 
        }

        .btn-register { 
            background: #16a34a; 
        }

        .btn-register:hover { 
            background: #15803d; 
        }

        .submit-btn:disabled { 
            background-color: #94a3b8; 
            cursor: not-allowed; 
        }

        .alert { 
            padding: 0.75rem; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            margin-bottom: 1.2rem; 
            display: none; 
            text-align: center; 
            font-weight: 600;
        }

        .alert-error { 
            background: #fee2e2; 
            color: #991b1b; 
            border: 1px solid #fca5a5;
        }

        .alert-success { 
            background: #dcfce7; 
            color: #166534; 
            border: 1px solid #86efac;
        }

        .toggle-text { 
            text-align: center; 
            margin-top: 1.5rem; 
            font-size: 0.85rem; 
            color: #64748b; 
        }

        .toggle-text a { 
            color: #1b4332; 
            text-decoration: none; 
            font-weight: 700; 
            cursor: pointer; 
            margin-left: 0.2rem;
        }

        .toggle-text a:hover {
            text-decoration: underline;
        }

        .hidden { 
            display: none !important; 
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-header">
            <i class="fa-solid fa-shield-halved"></i>
            <h2 id="formTitle">RGB ADMIN PORTAL</h2>
            <p id="formSubtitle">Authorized personnel only</p>
        </div>

        <!-- Alert Message -->
        <div id="alertBox" class="alert"></div>

        <!-- Admin Form -->
        <form id="adminForm">
            <!-- Register Only Field -->
            <div class="form-group hidden" id="nameGroup">
                <label for="adminName">Full Name</label>
                <input type="text" id="adminName" placeholder="Juan Dela Cruz" />
            </div>

            <div class="form-group">
                <label for="adminEmail">Admin Email</label>
                <input type="email" id="adminEmail" placeholder="admin@rgblending.com" required />
            </div>

            <div class="form-group">
                <label for="adminPassword">Password</label>
                <input type="password" id="adminPassword" placeholder="••••••••" required minlength="6" />
            </div>

            <button type="submit" id="submitBtn" class="submit-btn btn-login">Login to Admin Panel</button>
        </form>

        <div class="toggle-text">
            <span id="toggleLabel">Don't have an admin account?</span>
            <a id="toggleBtn">Register here</a>
        </div>
    </div>

    <!-- Firebase Bridge SDK Import -->
    <script type="module" src="firebase-config.js"></script>

    <script>
        const adminForm = document.getElementById('adminForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const toggleBtn = document.getElementById('toggleBtn');
        const nameGroup = document.getElementById('nameGroup');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const toggleLabel = document.getElementById('toggleLabel');

        let isLoginMode = true; // default login

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert alert-${type}`;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
            alertBox.textContent = '';
        }

        // TOGGLE LOGIN / REGISTER
        toggleBtn.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            hideAlert();
            adminForm.reset();

            if (isLoginMode) {
                // SWITCH TO LOGIN
                formTitle.textContent = 'RGB ADMIN PORTAL';
                formSubtitle.textContent = 'Authorized personnel only';
                submitBtn.textContent = 'Login to Admin Panel';
                submitBtn.className = 'submit-btn btn-login';
                nameGroup.classList.add('hidden');
                document.getElementById('adminName').required = false;
                toggleLabel.textContent = "Don't have an admin account?";
                toggleBtn.textContent = 'Register here';
            } else {
                // SWITCH TO REGISTER
                formTitle.textContent = 'Create Admin Account';
                formSubtitle.textContent = 'For Super Admin use only';
                submitBtn.textContent = 'Create Admin Account';
                submitBtn.className = 'submit-btn btn-register';
                nameGroup.classList.remove('hidden');
                document.getElementById('adminName').required = true;
                toggleLabel.textContent = 'Already have an account?';
                toggleBtn.textContent = 'Login here';
            }
        });

        adminForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAlert();

            const name = document.getElementById('adminName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!window.auth || !window.authTools || !window.firestoreTools) {
                showAlert('Initializing system... Please try again in 2 seconds.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = isLoginMode ? 'Verifying...' : 'Creating...';

            try {
                const { signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } = window.authTools;
                const { doc, getDoc, setDoc } = window.firestoreTools;
                
                if (isLoginMode) {
                    // ========== LOGIN LOGIC ==========
                    const userCredential = await signInWithEmailAndPassword(window.auth, email, password);
                    const user = userCredential.user;

                    // CHECK ROLE SA FIRESTORE
                    const adminDocRef = doc(window.db, "admin_users", user.uid);
                    const adminDocSnap = await getDoc(adminDocRef);

                    if (!adminDocSnap.exists()) {
                        await signOut(window.auth);
                        throw new Error('Access denied. You are not an admin.');
                    }

                    const adminData = adminDocSnap.data();
                    if (adminData.role !== 'admin') {
                        await signOut(window.auth);
                        throw new Error('Access denied. Admin privileges required.');
                    }

                    window.location.href = "admin.html";

                } else {
                    // ========== REGISTER LOGIC ==========
                    const userCredential = await createUserWithEmailAndPassword(window.auth, email, password);
                    const user = userCredential.user;

                    // AUTO ADD SA admin_users
                    await setDoc(doc(window.db, "admin_users", user.uid), {
                        name: name,
                        email: email,
                        role: 'admin',
                        createdAt: new Date().toISOString()
                    });

                    showAlert('Admin account created! Redirecting to login...', 'success');
                    adminForm.reset();
                    
                    // Auto switch back to login after 2s
                    setTimeout(() => {
                        toggleBtn.click();
                    }, 2000);
                }

            } catch (error) {
                console.error('Auth error:', error.code, error.message);
                
                submitBtn.disabled = false;
                submitBtn.textContent = isLoginMode ? 'Login to Admin Panel' : 'Create Admin Account';

                if (error.message.includes('Access denied')) {
                    showAlert(error.message);
                } else if (error.code === 'auth/email-already-in-use') {
                    showAlert('Email already in use.');
                } else if (error.code === 'auth/weak-password') {
                    showAlert('Password should be at least 6 characters.');
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') {
                    showAlert('Access denied. Invalid email or password.');
                } else {
                    showAlert('Error: ' + error.message);
                }
            }
        });
    </script>
</body>
</html>
